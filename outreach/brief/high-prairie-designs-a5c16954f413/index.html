<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="30"><title>Your Growth Brief is being prepared</title><style>
:root{color-scheme:light;--ink:#102625;--green:#087f5b;--mint:#e9f5f0;--line:#cddbd5;--paper:#fffdf8}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#f8f6ef 0%,#eef7f2 100%);color:var(--ink);font:16px/1.55 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(100%,620px);padding:clamp(28px,7vw,56px);border:1px solid var(--line);border-radius:24px;background:rgba(255,253,248,.96);box-shadow:0 20px 60px rgba(16,38,37,.1);text-align:center}.brand{display:inline-flex;align-items:center;gap:9px;margin-bottom:32px;color:var(--green);font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.mark{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--green);color:white;font-size:18px}h1{margin:0;font:700 clamp(38px,10vw,66px)/.98 Georgia,serif;letter-spacing:-.04em}h1 span{display:block;color:var(--green)}.business{margin:24px 0 0;font-weight:700;font-size:18px}.message{max-width:440px;margin:12px auto 0;color:#506360}.progress{height:7px;margin:34px auto 18px;overflow:hidden;border-radius:999px;background:var(--mint)}.progress::after{content:"";display:block;width:42%;height:100%;border-radius:inherit;background:var(--green);animation:move 1.8s ease-in-out infinite alternate}.refresh{margin:0;color:#75847f;font-size:13px}@keyframes move{to{transform:translateX(138%)}}@media(prefers-reduced-motion:reduce){.progress::after{animation:none;width:70%}}
</style></head><body><main class="card"><div class="brand"><span class="mark">✦</span> FlashCrafter Growth Brief</div><h1>Your report is <span>being generated.</span></h1><p class="business">Prepared for High prairie designs</p><p class="message">We’re gathering current search demand and local visibility data. Check back in a few minutes.</p><div class="progress" aria-label="Report generation in progress"></div><p class="refresh">This page refreshes automatically.</p></main></body></html>
